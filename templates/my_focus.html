<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    if(localStorage.getItem("token")==null){
        location.href="/login/"
    }
    let div=document.getElementById("big")
    axios.get("/focus/",{headers:{"Authorization":localStorage.getItem("token")}}).then(
        function(res){
            let data=res.data
            for(i=0;i<data.length;i++){
                d=data[i]
                console.log(d)
                div.innerHTML+=`
                <div class="card mb-3 shadow-sm">
          <div class="card-body d-flex align-items-center gap-3">
            <a href="/kongjian/${d.username}"><img src="${baseURL}${d.avatar_url}" class="rounded-circle" style="width:55px;height:55px;object-fit:cover;"></a>
            <div class="flex-grow-1">
                    <h6 class="mb-1">${d.name}</h6>

                <div class="text-secondary small">ip:${d.ip}&nbsp${d.gender}</div>
                <span style="background-color:#25AEF3;" class="badge">${d.ye}</span>
            </div>
                <button id="ii${d.uid}" name="${d.username}" onclick="unfocus(this)" class="btn btn-outline-danger btn-sm">取消关注</button>
            </div>
          </div>
                `
            }
        }
    ).catch(
        function(err){
            if(err.response.status==401){
                alert("请登录")
                location.href="/login/"
            }else if(err.response.status==400){
                div.innerHTML+=`
                    <div class="text-center text-secondary mt-5">
                        <h5>还没有关注任何人</h5>
                    </div>
                `
            }
        }
    )
    function unfocus(btn){
        let username=btn.name
        console.log(btn.name)
        axios.delete('/focus/',{data:{username:username}},{headers:{"Authorization":localStorage.getItem("token")}}).then(
            function(res){
                btn.className="btn btn-primary btn-sm"
                btn.innerText="关注"
                btn.onclick=function(){focus(btn)}
            }
        )
    }
    function focus(btn){
        let id=btn.id.slice(2)
        username=btn.name
        axios.post("/focus/",{username:username},{headers:{"Authorization":localStorage.getItem("token")}}).then(
            function(res){
                btn.className="btn btn-outline-danger btn-sm"
                btn.innerText="取消关注"
                btn.onclick=function(){unfocus(btn)}
            }
        )
    }
    function ba(){
        location.href=document.referrer
    }
</script>
