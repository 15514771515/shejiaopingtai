{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fff8e0;
            padding: 4rem 2rem;
        }
        .verify-box {
            max-width: 950px;
        }
        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
        }
    </style>
</head>
<body>
<div class="verify-box bg-white rounded-4 shadow-lg p-5 mx-auto">
    <h3 class="mb-4 text-dark fw-medium">请先进行邮箱验证</h3>
    <span id="msg"></span>
    <div class="d-flex gap-3">
        <input id="email" type="email" class="form-control form-input form-control-lg border-secondary-subtle flex-grow-1" placeholder="请输入邮箱">
        <button id="btn" onclick="cli()" class="btn btn-warning btn-lg">点击获取验证码</button>
        <!-- 返回上一步按钮，点击返回上一页 -->
        <a href="/center/" class="btn btn-outline-dark btn-lg">返回</a>
    </div>
    <span style="color:red" id="er"></span>
</div>
 <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    if(localStorage.getItem("token")==null){
        location.href="/login/"
    }
    function cli(){
        let msg=document.getElementById("msg")
        msg.style.color="#30C5DC"
        email=document.getElementById("email").value
        msg.innerText="正在发送中,请稍后..."
        let btn=document.getElementById("btn")
        let i = 60;
        btn.disabled = true;
        btn.innerText = i+'s';
        const timer = setInterval(() => {
            i--;
            btn.innerText = i + 's';
            if (i <= 0) {
                clearInterval(timer);
                btn.disabled = false;
                btn.innerText = '获取验证码';
              }
            }, 1000);
        let er=document.getElementById("er")
        if(email==''){
            er.innerText="请先输入邮箱!"
            i=0
            msg.innerText=''
            t=setTimeout(function(){er.innerText=''},3800)
            return
        }
        axios.post("/vertify/",{email:email,token:localStorage.getItem("token")}).then(
            function func(res){
                msg.innerText=""
                alert("发送成功,点击跳转")
                location.href="/modify_password/"
            }
        ).catch(
            function fun(err){
                if(err.response.data.code==403){
                    msg.style.color="red"
                    msg.innerText="请先登录,即将跳转登录页..."
                    setTimeout(function(){location.href="/login/"},1500)
                }else if(err.response.data.code==400){
                    er.innerText="无效的邮箱号"
                    i=0
                    msg.innerText=''
                    setTimeout(function(){er.innerText=''},4000)
                }else{
                    msg.innerText=""
                    setTimeout(function(){alert("出现错误,请稍后重试")},100)
                }
            }
        )
    }
</script>
</body>
</html>
