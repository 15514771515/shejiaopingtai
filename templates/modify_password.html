{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <!-- Bootstrap5 CDN -->
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f3e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border-radius: 16px;
            border: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #ddd;
            transition: all 0.25s ease;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }
        .btn-submit {
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
        }
        .back-link {
            text-decoration: none;
            font-size: 16px;
        }
        .code-tip {
            font-size: 15px;
        }
        .oo{
            color:red;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-12">
            <div class="card p-5">
                <!-- 返回链接 -->
                <a href="/email/" class="back-link text-primary mb-4 d-inline-block">
                    ← 返回
                </a>
                <h2 class="fw-bold mb-5 text-dark">修改密码</h2>
                    <!-- 原密码 -->
                    <div class="mb-4">
                        <input id="password1" type="password" class="form-control" placeholder="请输入原密码">
                        <span class="oo" id="passwprd1_msg"></span>
                    </div>
                    <!-- 新密码 -->
                    <div class="mb-4">
                        <input id="password2" type="password" class="form-control" placeholder="请输入新密码">
                        <span class="oo" id="passwprd2_msg"></span>
                    </div>
                    <div class="mb-4">
                        <input id="password3" type="password" class="form-control" placeholder="再次输入新密码">
                        <span class="oo" id="passwprd3_msg"></span>
                    </div>
                    <!-- 验证码 -->
                    <div class="mb-3">
                        <input id="vertifycode" type="text" class="form-control" placeholder="请输入验证码">
                        <span class="oo" id="vertifycode_msg"></span>
                    </div>
                    <!-- 验证码提示 -->
                    <hr>
                    <!-- 提交按钮 -->
                    <button onclick="sub()" class="btn btn-primary w-100">提交</button>

            </div>
        </div>
    </div>
</div>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    if(localStorage.getItem("token")==null){
        location.href="/login/"
    }
    function sub(){
        let password1=document.getElementById("password1").value
        let password2=document.getElementById("password2").value
        let password3=document.getElementById("password3").value
        let vertifycode=document.getElementById("vertifycode").value
        axios.post("/new_password_vertification/",{password1:password1,password2:password2,password3:password3,vertifycode:vertifycode,token:localStorage.getItem("token")}).then(
            function func(res){
                alert("密码修改成功,请重新登录")
                localStorage.clear()
                location.href="/login/"
            }
        ).catch(
            function fun(err){
                if(err.response.data.code==400){
                    let ii=document.getElementById("passwprd1_msg")
                    ii.innerText=err.response.data.pwd_msg
                    setTimeout(function(){ii.innerText=''},3800)
                    let vv=document.getElementById("vertifycode_msg")
                    vv.innerText=err.response.data.ver_msg
                    setTimeout(function(){vv.innerText=''},3800)
                }else if(err.response.data.code==403){
                    alert("请重新登录")
                }else if(err.response.data.code==401){
                    let io=document.getElementById("passwprd3_msg")
                    io.innerText="两次密码不一致"
                    setTimeout(function(){io.innerText=''},3800)
                }else if(err.response.data.code==405 || err.response.data.code==406){
                    let io=document.getElementById("passwprd3_msg")
                    let it=document.getElementById("passwprd2_msg")
                    io.innerText="请输入8到12位字符"
                    it.innerText="请输入8到12位字符"
                    setTimeout(function(){io.innerText=''},3800)
                    setTimeout(function(){it.innerText=''},3800)
                }
            }
        )
    }
</script>
</body>
</html>
