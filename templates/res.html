{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background-color: #f6f8fa;
        }
        .reg-card{
            max-width:420px;
        }
        .err_ms{
            color:red;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="reg-card card p-5 shadow">
                <h3 class="text-center mb-4">用户注册</h3>
                <h5 class="text-center mb-4 text-secondary">新用户注册</h5>

                <div class="mb-3">
                    <input name="username" type="text" class="form-control" placeholder="设置用户名">
                    <span class="err_ms" id="username_err"></span>
                </div>
                <div class="mb-3">
                    <input name="password" type="password" class="form-control" placeholder="设置密码">
                    <span class="err_ms" id="password_err"></span>
                </div>
                <div class="mb-4">
                    <input name="password_1" type="password" class="form-control" placeholder="再次输入密码">
                    <span class="err_ms" id="password2_err"></span>
                </div>
                <div class="input-group mb-3">
                    <input name="email" id="email" type="text" class="form-control" placeholder="请输入邮箱"
                           aria-label="Recipient’s username" aria-describedby="button-addon2">
                    <button onclick="send()" class="btn btn-outline-secondary" type="button" id="button-addon2">发送验证码</button>

                </div>
                <span style="display:block;" class="err_ms" id="email_err"></span>
                <div class="mb-4">
                    <input name="vertifycode" type="text" class="form-control" placeholder="请输入邮箱验证码">
                    <span class="err_ms" id="ver_err"></span>
                </div>
                <button onclick="res()" class="btn btn-primary w-100">立即注册</button>
                <div class="mt-3 text-center">
                    <a href="/login/">已有账号？去登录</a>
                </div>
                <span id="oop"></span>

            </div>
        </div>
    </div>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="{% static 'api.js' %}"></script>
    <script>
        function send(){
            let span=document.getElementById("oop")
            span.style.color="#1E89EA"
            let email=document.getElementById("email").value
            let btn=document.getElementById("button-addon2")
            let i = 60;
            btn.disabled = true;
            btn.innerText = i+'s';
            const timer = setInterval(() => {
                i--;
                btn.innerText = i + 's';
                if (i <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = '获取验证码';
                }
            }, 1000);
            axios.post("/sendmail/",{email:email}).then(
                function(res){
                    span.style.color="green"
                    span.innerText="验证码已发送"
                }
            ).catch(
                function(err){
                    let msg=err.response.data.msg
                    i=0
                    console.log(msg)
                    alert(msg)
                }
            )
        }
        function res(){
            let u=document.getElementById("username")

            let username=document.getElementsByName("username")[0].value
            let password=document.getElementsByName("password")[0].value
            let password_1=document.getElementsByName("password_1")[0].value
            let email=document.getElementsByName("email")[0].value
            let vertifycode=document.getElementsByName("vertifycode")[0].value
            let data={
                username:username,
                password:password,
                password_1:password_1,
                email:email,
                vertifycode:vertifycode
            }
            axios.post("/res/",data=data).then(
                function succ(res){
                    window.location.href='/login/'
                    alert("注册成功,请登录")
                }
            ).catch(
                function(err){
                    if(err.response){
                        if(err.response.data.code==403){
                            alert("该账号已存在")
                            return
                        }
                        let errs=err.response.data
                        let us_span=document.getElementById("username_err")
                        let pwd_span=document.getElementById("password_err")
                        let pwd2_span=document.getElementById("password2_err")
                        let em_span=document.getElementById("email_err")
                        let ver_span=document.getElementById("ver_err")
                        us_span.innerText=errs.username_err
                        if(errs.us!='' || username.length>12 || username.length<5){us_span.innerText="请输入5到12位纯数字"}
                        pwd_span.innerText=errs.password_err
                        pwd2_span.innerText=errs.not_same
                        em_span.innerText=errs.email_err
                        ver_span.innerText=errs.ver_err
                        setTimeout(function(){
                            us_span.innerText=''
                            pwd_span.innerText=''
                            pwd2_span.innerText=''
                            em_span.innerText=''
                            ver_span.innerText=''
                        },4000)
                    }else{
                        let errs=null
                    }
                }
            )
        }
    </script>
</body>
</html>
