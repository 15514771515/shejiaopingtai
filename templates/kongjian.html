{% load static %}
<!DOCTYPE html>
<html lang="zh-CN" xmlns="http://www.w3.org/1999/html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人空间</title>
  <!-- Bootstrap 5 核心 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 简单图标库 (仅用于基础图标) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: #e9ebee;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .avatar-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border: 2px solid #fff;
      background: #d4d9e0;
    }
    .info-item {
      display: flex;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #f0f2f5;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .info-icon {
      width: 26px;
      color: #6c7a8d;
      font-size: 1rem;
      text-align: center;
      margin-right: 10px;
    }
    .info-label {
      color: #6c7a8d;
      width: 60px;
      font-size: 0.9rem;
    }
    .info-value {
      color: #1d2129;
      font-weight: 500;
      flex: 1;
    }
    .cover-simple {
      background: #dce3ec;
      height: 70px;
      border-radius: 12px 12px 0 0;
    }
    @media (max-width: 576px) {
      .avatar-img { width: 76px; height: 76px; }
      .info-label { width: 50px; }
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9 col-12">
         <a href="#" onclick="ba()" class="btn btn-outline-primary btn-sm">← 返回</a>
        <a href="/" onclick="ba()" class="btn btn-outline-primary btn-sm">🏠 首页</a>
        <!-- 主卡片：个人空间 -->
        <div class="card overflow-hidden">
          <!-- 简单装饰条 -->

          <div class="cover-simple"></div>
          <div class="card-body px-4 pt-0">
            <!-- 头像 + 姓名行 -->
            <div id="fff" class="d-flex align-items-end" style="margin-top: -36px;">
              <a id="av1" href=""><img id="av" src="../media/avatar/img.png" alt="头像" class="avatar-img rounded-circle border border-2 border-white"></a>
              <div class="ms-3 mb-1">
                <h4 class="fw-bold mb-0" id="name"></h4>
                <span class="text-secondary small"><i class="bi bi-geo-alt me-1"></i><span id="ip"></span></span>
              </div>
            </div>

            <!-- 信息列表：性别 / 年龄 / 生日 / IP / 职业 -->
            <div class="mt-3 pt-1">
              <div class="info-item">
                <span class="info-icon"><i class="bi bi-person-circle me-1"></i></span>
                <span class="info-label">账号</span>
                <span id="username" class="info-value">...</span>
              </div>
              <div class="info-item">
                <span class="info-icon"><i class="bi bi-gender-ambiguous"></i></span>
                <span class="info-label">性别</span>
                <span id="gender" class="info-value">...</span>
              </div>
              <div class="info-item">
                <span class="info-icon"><i class="bi bi-cake2"></i></span>
                <span class="info-label">年龄</span>
                <span id="age" class="info-value">.....</span>
              </div>
              <div class="info-item">
                <span class="info-icon"><i class="bi bi-calendar-event"></i></span>
                <span class="info-label">生日</span>
                <span id="birth" class="info-value">.....</span>
              </div>
              <div class="info-item">
                <span class="info-icon"><i class="bi bi-briefcase"></i></span>
                <span class="info-label">职业</span>
                <span id="job" class="info-value">.....</span>
              </div>
            </div>

            <!-- 简单签名 -->
            <div class="mt-2 text-secondary small border-top pt-2 d-flex">
              <i onclick="openModal()" class="bi bi-chat-quote me-1"></i>
              <span onclick="openModal()" id="qian">........</span>
            </div>
          </div>
        </div>
        <!-- 最近动态卡片 (包含用户ID、发布时间、内容) -->
        <div class="card mt-3">
          <div class="card-body px-4 py-3">
            <h6 class="fw-bold mb-2"><i class="bi bi-newspaper me-2 text-primary"></i>最近动态</h6>
            <div id="ddoo">
            </div>
            <!-- 动态 1 -->
            <!-- 底部小提示 (极简) -->
            <div id="more" class="text-center text-secondary small mt-3 opacity-50">

            </div>
          </div>
        </div>
      </div>
      <div class="modal fade" id="inputModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
          <div class="modal-content">
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title">请输入内容</h5>
              <button type="button" class="btn-close btn-close-white" onclick="closeModal()"></button>
            </div>
            <div class="modal-body">
              <input type="text" id="myInput" class="form-control" placeholder="请输入...">
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="closeModal()">取消</button>
              <button class="btn btn-primary" onclick="confirmInput()">确定</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="{% static 'api.js' %}"></script>
    <script>
      if(localStorage.getItem("token")==null){
        location.href="/login/"
    }
    const pathArr = location.pathname.split('/')
    const pk = Number(pathArr.pop())

    if(localStorage.getItem("shua")!="y"){
        location.reload()

    }
    localStorage.setItem("shua","y")
    console.log(pk)
    axios.get("/get_files/",{params:{pk:pk},headers:{"Authorization":localStorage.getItem("token")}}).then(
        function(res){
            data=res.data
            console.log(pk)
            console.log(data.iffocus)
            focusdiv=document.getElementById("fff")
            if(pk!=data.username1 && data.iffocus=="yes"){
                focusdiv.innerHTML+=`<button name="${data.username}" onclick="unfocus1(this)" id="follow_btn" class="btn btn-outline-danger ms-auto">取消关注</button>`
            }else if(pk!=data.username1 && data.iffocus!="yes"){
                focusdiv.innerHTML+=`<button name="${data.username}" onclick="focus1(this)" id="follow_btn" class="btn btn-primary ms-auto">关注</button>`
            }else{
                console.log("ddd")
            }
            us=document.getElementById("username")
            us.innerText=data.username
            av=document.getElementById("av")
            av1=document.getElementById("av1")
            av1.href=data.avatar_url
            av.src=`${baseURL}${data.avatar_url}`
            n=document.getElementById("name")
            n.innerText=data.name
            localStorage.setItem("name",data.name)
            ip=document.getElementById("ip")
            ip.innerText=data.ip
            gender=document.getElementById("gender")
            if(data.gender=="♂"){gender.innerText="男"}else if(data.innerText=="♀"){gender.innerText="女"}else{gender.innerText="保密"}
            age=document.getElementById("age")
            age.innerText=data.age
            birth=document.getElementById("birth")
            birth.innerText=data.birth
            job=document.getElementById("job")
            job.innerText=data.job
            qian=document.getElementById("qian")
            val=data.qian
            if(val==''){qian.innerText='........'}else(qian.innerText=val)

        }
    )
    axios.get("/get_dongtai/",{params:{pk:pk},headers:{"Authorization":localStorage.getItem("token")}}).then(
        function(res){
            ir=res.data[0]

            d=ir.slice(0,2)
            ddoo=document.getElementById("ddoo")
            if(d.length==0){
                ddoo.innerHTML=`
                    <div class="text-center text-secondary mt-5">
                        <h5>空空如也~</h5>
                    </div>
                `
                return
            }
            for(o=0;o<d.length;o++){
                a=d[o]
                ddoo.innerHTML+=`
              <div id="id${a.id}" onclick="comm(this)" style="background-color:#DCE3EC" class="card mt3 p-4">
            <div class="feed-item">
              <div class="feed-meta">
                <i class="bi bi-person-circle me-1"></i>${a.time}
              </div>
              <div class="feed-content">
                <strong>${a.text}</strong>
              </div>
              <div id="im${o}"></div>
            </div>
            <div id="di${o}" style="color:red;margin-top:20px"></div>
            </div>
            <br>
                `
            }
            for(p=0;p<d.length;p++){
                i=d[p]
                id=i.id
                imdiv=document.getElementById("im"+p)
                dio=document.getElementById("di"+p)
                if(localStorage.getItem(`${id}`)!="read" && localStorage.getItem(`${id}`)!=null && i.username1==i.username){
                    dio.innerText="有新评论"
                }
                for(h=1;h<=6;h++){
                    url=i["img"+h+"_url"]
                    if(url!=''){
                        imdiv.innerHTML+=`<a href="${baseURL}/${url}"><img src="${baseURL}/${url}" style="margin-top:8px" width="100" height="100" alt=""></a>`
                    }
                }
            }
            more=document.getElementById("more")
            more.innerHTML=`<i class="bi bi-person-circle me-1"></i><a onclick="tiao()" href="#" style="text-decoration:none">查看所有</a>`
        }
    )
    function openModal(){
    const dom = document.querySelector('#inputModal')
    dom.classList.add('show')
    dom.style.display = 'block'
    document.body.classList.add('modal-open')

    //增加遮罩层
    if(!document.querySelector('.modal-backdrop')){
        const mask = document.createElement('div')
        mask.className = 'modal-backdrop fade show'
        document.body.appendChild(mask)
    }
}

function closeModal(){
    const dom = document.querySelector('#inputModal')
    dom.classList.remove('show')
    dom.style.display = 'none'
    document.body.classList.remove('modal-open')

    const mask = document.querySelector('.modal-backdrop')
    if(mask) mask.remove()
}

function confirmInput(){
    let token=localStorage.getItem("token")
    let ye=true
    axios.get("/qianming/",{params:{username:pk}},{headers:{"Authorization":token}}).then(
        function(res){
            ye=false
        }
    ).catch(
        function(err){
            return
        } 
    )
    if(ye){
        return
    }
    const val = document.getElementById("myInput").value.trim()
    console.log('输入内容', val)
    
    axios.post("/qianming/",{token:token,val:val}).then(
        function(res){
            qian=document.getElementById("qian")
            if(val==''){qian.innerText="........"}else{qian.innerText=val}
        }
    )
    closeModal()
  }
  function comm(btn){
      id=btn.id.slice(2)
      localStorage.setItem("dong_id",id)
      localStorage.setItem("pre",location.href)
      location.href="/comments/"
  }
    function tiao(){
        axios.post("/if_focus/",{username1:pk,token:localStorage.getItem("token")}).then(
            function(res){
                location.href="/more2/"+pk
            }
        ).catch(
            function(err){
                 alert('你需要关注ta才可以查看')
            }
        )
    }
    function focus1(btn){
        username=btn.name
        axios.post("/focus/",{username:username},{headers:{"Authorization":localStorage.getItem("token")}}).then(
            function(res){
                btn.innerText="取消关注"
                btn.className="btn btn-outline-danger ms-auto"
                btn.onclick=function(){unfocus1(btn)}
            }
        ).catch(
            function(err){
                if(err.response){
                    if(err.response.status==401){
                        alert("请登录")
                        location.href="/login/"
                    }
                }
                alert("出现错误")
            }
        )
    }
    function unfocus1(btn){
        username=btn.name
        axios.delete("/focus/",{data:{username:username}},{headers:{"Authorization":localStorage.getItem("token")}}).then(
            function(res){
                btn.innerText="关注"
                btn.className="btn btn-primary ms-auto"
                btn.onclick=function(){focus1(btn)}
            }
        ).catch(
            function(err){
                if(err.response){
                    if(err.response.status==401){
                        alert("请登录")
                        location.href="/login/"
                    }
                }
                alert("出现错误")
            }
        )
    }
      function ba(){
          location.href=document.referrer
      }
</script>
</body>
</html>
