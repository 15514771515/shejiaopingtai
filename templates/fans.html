<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    if(localStorage.getItem("token")==null){
        location.href="/login/"
    }
    axios.get("/get_fans/",{headers:{"Authorization":localStorage.getItem("token")}}).then(
        function(res){
            let div=document.getElementById("big")
            let data=res.data
            for(i=0;i<data.length;i++){
                d=data[i]
                div.innerHTML+=`
                <div class="card mb-3 shadow-sm">
          <div class="card-body d-flex align-items-center gap-3">
            <a href="/kongjian/${d.username}"><img src="${baseURL}${d.avatar_url}" class="rounded-circle" style="width:55px;height:55px;object-fit:cover;"></a>
            <div class="flex-grow-1">
                    <h6 class="mb-1">${d.name}</h6>

                <div class="text-secondary small">ip:${d.ip}&nbsp${d.gender}</div>

            </div>
                <button name="${d.username}" onclick="focus1(this)" class="btn btn-primary btn-sm">${d.ye}</button>
            </div>
          </div>
          `
            }
            for(n=0;n<res.data.length;n++){
                oo=res.data[n]
                ff=document.getElementsByName(oo.username)[0]
                if(ff.innerText=="互相关注"){
                    ff.className="btn btn-outline-primary btn-sm"
                    ff.disabled='true'
                }
            }
        }

    ).catch(
        function(err){
            let div=document.getElementById("big")
            if(err.response.status==401){
                alert("请登录")
                location.href="/login/"
            }else if(err.response.status==404){
                div.innerHTML+=`
                    <div class="text-center text-secondary mt-5">
                        <h5>还没有任何人关注你</h5>
                    </div>
                `
            }
        }

    )
    function focus1(btn){
        username=btn.name
        axios.post("/focus/",{username:username},{headers:{"Authorization":localStorage.getItem("token")}}).then(
            function(res){
                btn.innerText="互相关注"
                btn.className="btn btn-outline-primary btn-sm"
                btn.disabled='true'
            }
        )
    }
</script>
