{% load static %}
<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial‑scale=1">
<title>评论区</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#52D363">
<div id="ffo" class="container py-4" style="max-width:720px;">
    <h3 class="mb-4">评论区</h3>
    <button onclick="back()" class="btn btn-outline-primary"
            style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">
        返回
    </button>
    <!-- 提交评论表单 -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <textarea id="comment" name="content" class="form-control" rows="3"
                      placeholder="写下你的评论..."></textarea>
            <span style="color:red" id="msg"></span>

            <div class="mt-3 text-end">
            <button onclick="submit()" class="btn btn-primary">提交评论</button>
            </div>
        </div>
    </div>

<!--    &lt;!&ndash; 作者评论，带头像+作者标签 &ndash;&gt;-->

<!--        <div class="card-body d-flex gap-3">-->

<!--            <div class="flex‑grow‑1">-->

<!--                    <h6 class="mb‑0">张三</h6>-->

<!--    </div>-->
</div>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    if(localStorage.getItem("token")==null){
        location.href="/login/"
    }
  let dong_id=localStorage.getItem("dong_id")
  localStorage.setItem(`${dong_id}`,"read")
  axios.get("/comment/",{params:{dong_id:dong_id},headers:{"Authorization":"Bearer "+localStorage.getItem("token")}}).then(
      function(res){
          let ffo=document.getElementById("ffo")
          if(res.data.length==0){
              ffo.innerHTML+=`
                  <div class="card mb-3 shadow-sm">
                    <div class="card-body d-flex gap-3">
                      暂时没有评论
                    </div>
                    </div>
              `
              return
          }
          ffo.innerHTML+=`
                  <div class="card mb-3 shadow-sm">
                    <div id="numb" class="card-body d-flex gap-3">
                      全部评论(${res.data.length})
                    </div>
                    </div>
              `
          for(i=0;i<res.data.length;i++){
              d=res.data[i]
              console.log(d)
              ffo.innerHTML+=`
                  <div id="in${d.id}" class="card mb-3 shadow-sm">
                    <div class="card-body d-flex gap-3">
                      <a href="/kongjian/${d.username}"><img src="${d.ava_url}" class="rounded‑circle flex‑shrink‑0" style="border-radius:50%;width:48px;height:48px;"></a>
                      <div class="flex‑grow‑1">
                        <div class="d‑flex align‑items‑center gap‑2">
                          <h6 class="mb‑0">${d.name}</h6>
                        <span id="tou${i+1}" style="background-color:red;" class="badge"></span>
                        <span id="mine${i+1}" style="background-color:#1381C5;" class="badge"></span>
                        <span class="text‑secondary small ms‑auto">${d.time}</span>

                        </div>
                        <p class="mb‑0 mt‑2 text‑muted">${d.text}</p>
                        <span id="jk${i+1}" class="mt-3 text-end"></span>
                    </div>
                    </div>
                </div>`
          }
          for(n=1;n<=res.data.length;n++){
              let oo=document.getElementById("tou"+n)
              let mine=document.getElementById("mine"+n)
              if(res.data[n-1].username==res.data[n-1].blog_username){
                  oo.innerText="作者"
              }
              if(res.data[n-1].now_username==res.data[n-1].username){
                  jk=document.getElementById("jk"+n)
                  jk.innerHTML=`<button id="co${res.data[n-1].id}" onclick="del_co(this)" type="button" title="删除该评论" class="btn btn-sm btn-light">🗑️</button>`
                  mine.innerText="我"
              }
          }
      }

  )
  function del_co(btn){
       id=btn.id.slice(2)
       rr=confirm("你要删除该评论吗?")
       if(! rr){
           return
       }
       axios.delete(`/del_co/${id}`,{headers:{"Authorization":localStorage.getItem("token")}}).then(
           function(res){
               lp=document.getElementById("in"+id)
               let numb=document.getElementById("numb")
               numb.innerText=`全部评论(${res.data.co_num})`
               lp.remove()
           }
       ).catch(
           function(err){
               if(! err.response){
                   alert("出现错误")
                   return
               }
               if(err.response.status==401){
                   alert("请重新登录")
                   location.href="/login/"
               }
           }
       )
  }
  function submit(){
      let comm=document.getElementById("comment").value
      if(comm==''){
          dd=document.getElementById("comment")
          dd1=document.getElementById("msg")
          dd1.innerText="评论不能为空"
          dd.style.border="solid 2px red"
          setTimeout(()=>{
              dd.style.border="solid 1px black"
              dd1.innerText=''
          },5000)
          return
      }
      axios.post("/comment/",{text:comm,dong_id:dong_id},{headers:{"Authorization":localStorage.getItem("token")}}).then(
         function(res){
             location.href="/comments/"
         }
      )
  }
  function back(){
      location.href = localStorage.getItem("pre")
  }
</script>
</body>
</html>
