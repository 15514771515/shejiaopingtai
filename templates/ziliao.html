{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">编辑个人资料</h5>
                </div>
                <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">性别</label>
                            <select id="gender" name="gender" class="form-select">
                                <option value="">保密</option>
                                <option value="♂">男♂</option>
                                <option value="♀">女♀</option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">年龄</label>
                            <input id="age" value="" type="number" name="age" class="form-control"
                                   placeholder="输入年龄" min="1" max="120">
                        </div>

                    <div class="mb-3">
                        <label class="form-label">生日</label>
                        <input value="" id="birth" type="date" name="birthday" class="form-control">
                    </div>
                    <div class="mb-3">
                    <label class="form-label">IP</label>
                    <select id="ip" name="province" class="form-select" required>
                        <option value="未知">请选择IP</option>
                        <option value="北京">北京市</option>
                        <option value="天津">天津市</option>
                        <option value="上海">上海市</option>
                        <option value="重庆">重庆市</option>
                        <option value="河北">河北省</option>
                        <option value="山西">山西省</option>
                        <option value="辽宁">辽宁省</option>
                        <option value="吉林">吉林省</option>
                        <option value="黑龙江">黑龙江省</option>
                        <option value="江苏">江苏省</option>
                        <option value="浙江">浙江省</option>
                        <option value="安徽">安徽省</option>
                        <option value="福建">福建省</option>
                        <option value="江西">江西省</option>
                        <option value="山东">山东省</option>
                        <option value="河南">河南省</option>
                        <option value="湖北">湖北省</option>
                        <option value="湖南">湖南省</option>
                        <option value="广东">广东省</option>
                        <option value="海南">海南省</option>
                        <option value="四川">四川省</option>
                        <option value="贵州">贵州省</option>
                        <option value="云南">云南省</option>
                        <option value="陕西">陕西省</option>
                        <option value="甘肃">甘肃省</option>
                        <option value="青海">青海省</option>
                        <option value="台湾">台湾省</option>
                        <option value="内蒙古">内蒙古自治区</option>
                        <option value="广西">广西壮族自治区</option>
                        <option value="西藏">西藏自治区</option>
                        <option value="宁夏">宁夏回族自治区</option>
                        <option value="新疆">新疆维吾尔自治区</option>
                        <option value="香港">香港特别行政区</option>
                        <option value="澳门">澳门特别行政区</option>
                    </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">职业</label>
                        <input id="job" type="text" name="job" class="form-control"
                               placeholder="例如：学生、程序员">
                    </div>
                    <span id="opp" style="color:blue"></span>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="/" class="btn btn-secondary">取消</a>
                            <button onclick="save()" class="btn btn-primary">保存资料</button>
                        </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    if(localStorage.getItem("token")==null){
        location.href="/login/"
    }
    gender=document.getElementById("gender")
    age=document.getElementById("age")
    birth=document.getElementById("birth")
    ip=document.getElementById("ip")
    job=document.getElementById("job")
    axios.get("/get_files/",{headers:{"Authorization":localStorage.getItem("token")}}).then(
        function(res){
            console.log(res.data)
            gender.value=res.data.gender
            age.value=res.data.age
            birth.value=res.data.birth
            job.value=res.data.job
            ip.value=res.data.ip
        }
    ).catch(
        function(err){
            if(! err.response){
                alert("出现错误")
                return
            }
            if(err.response.status==401){
                alert("请登录")
                location.href="/login/"
            }
        }
    )
    function save(){
        data={
            gender:gender.value,
            age:age.value,
            birth:birth.value,
            ip:ip.value,
            job:job.value
        }
        axios.post("/get_files/",data,{headers:{"Authorization":localStorage.getItem("token")}}).then(
            function(res){
                if(res.status==204){
                    opp=document.getElementById("opp")
                    opp.innerText="资料未修改"
                    setTimeout(()=>{opp.innerText=''},4000)
                    return
                }
                alert("保存成功")
            }
        ).catch(
            function(err){
                if(! err.response){
                    alert("出现错误")
                    return
                }
                if(err.response.status==401){
                    alert("请登录")
                    location.href="/login/"
                }
            }
        )
    }
</script>
</body>
</html>
